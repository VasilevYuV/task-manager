<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1><i class="fas fa-tasks"></i> Task Manager</h1>
        <p class="subtitle">Простое управление задачами</p>
    </header>

    <main class="main-content">
        <!-- Форма создания/редактирования задачи -->
        <section class="task-form-section">
            <h2 id="form-title"><i class="fas fa-plus"></i> Новая задача</h2>
            <form id="task-form" class="task-form">
                <div class="form-group">
                    <label for="title">Заголовок *</label>
                    <input type="text" id="title" name="title"
                           placeholder="Введите заголовок задачи"
                           minlength="3" maxlength="100" required>
                    <small class="form-hint">От 3 до 100 символов</small>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description"
                              rows="3" maxlength="500"
                              placeholder="Опишите задачу (не более 500 символов)"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Статус *</label>
                        <select id="status" name="status" required>
                            <option value="">Выберите статус</option>
                            <option value="TODO">TODO</option>
                            <option value="IN_PROGRESS">IN PROGRESS</option>
                            <option value="DONE">DONE</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">Срок выполнения</label>
                        <input type="datetime-local" id="dueDate" name="dueDate">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <i class="fas fa-save"></i> Сохранить
                    </button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">
                        <i class="fas fa-times"></i> Отмена
                    </button>
                </div>

                <div id="form-error" class="error-message" style="display: none;"></div>
            </form>
        </section>

        <!-- Список задач -->
        <section class="tasks-section">
            <div class="section-header">
                <h2><i class="fas fa-list"></i> Список задач</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="TODO">TODO</button>
                    <button class="filter-btn" data-filter="IN_PROGRESS">IN PROGRESS</button>
                    <button class="filter-btn" data-filter="DONE">DONE</button>
                </div>
            </div>

            <div class="tasks-container">
                <table class="tasks-table">
                    <thead>
                    <tr>
                        <th>Заголовок</th>
                        <th>Описание</th>
                        <th>Статус</th>
                        <th>Дата создания</th>
                        <th>Срок выполнения</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody id="tasks-table-body">
                    <!-- Задачи будут добавлены здесь -->
                    </tbody>
                </table>
                <div id="no-tasks" class="no-tasks">
                    <i class="fas fa-inbox"></i>
                    <p>Нет задач. Создайте первую!</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Модальное окно подтверждения удаления -->
    <div id="delete-modal" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-exclamation-triangle"></i> Подтверждение удаления</h3>
            <p>Вы уверены, что хотите удалить эту задачу?</p>
            <div class="modal-actions">
                <button id="confirm-delete" class="btn btn-danger">Удалить</button>
                <button id="cancel-delete" class="btn btn-secondary">Отмена</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
